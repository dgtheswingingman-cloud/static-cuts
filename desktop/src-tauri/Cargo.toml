[package]
name = "static-cuts-desktop"
version = "0.1.0"
description = "Static-Cuts desktop app: Local Cuts with folder watching"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
notify = "6"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for talking to Ollama on this PC (http://127.0.0.1:11434), so no TLS.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
