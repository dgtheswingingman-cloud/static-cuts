# Nightly backup of the Static Cuts database.
#
# Dumps every table in the public schema (artists, songs, collections,
# ratings, comments, submissions, discoveries, undo history...) plus the
# auth.users table the rest depends on, locks the file with a password, and
# keeps it as a downloadable file on the workflow run for 30 days.
# The repo is public, so the backup is always encrypted before upload.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     the "Session pooler" connection string from
#                       Supabase > Connect, with your database password in it
#   BACKUP_PASSPHRASE   any long password; you need it to open a backup
#
# Restoring: see docs/backups.md.

name: Database backup

on:
  schedule:
    - cron: "17 3 * * *" # every night at 03:17 UTC
  workflow_dispatch: {}   # "Run workflow" button for a backup on demand

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets first (see the top of this file)."
            exit 1
          fi

      - name: Install Postgres 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          PGBIN=/usr/lib/postgresql/17/bin
          STAMP=$(date -u +%Y-%m-%d)
          mkdir -p backup
          $PGBIN/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges \
            --format=custom --file=backup/public.dump
          $PGBIN/pg_dump "$SUPABASE_DB_URL" --table=auth.users --data-only --no-owner --no-privileges \
            --format=custom --file=backup/auth_users.dump
          # A quick readable summary, to check a backup looks right without restoring it.
          $PGBIN/psql "$SUPABASE_DB_URL" -At -c "
            select 'artists', count(*) from public.artists union all
            select 'tracks', count(*) from public.tracks union all
            select 'collected', count(*) from public.track_ownership union all
            select 'ratings', count(*) from public.ratings union all
            select 'comments', count(*) from public.comments" > backup/counts.txt
          cat backup/counts.txt
          tar -czf "static-cuts-$STAMP.tar.gz" backup
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Lock the backup with the password
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "static-cuts-$STAMP.tar.gz.gpg" "static-cuts-$STAMP.tar.gz"
          rm -rf backup "static-cuts-$STAMP.tar.gz"
          ls -lh

      - name: Keep the backup for 30 days
        uses: actions/upload-artifact@v5
        with:
          name: static-cuts-backup-${{ env.STAMP }}
          path: static-cuts-${{ env.STAMP }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
