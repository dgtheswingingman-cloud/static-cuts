# Builds the Static-Cuts desktop app (desktop/) for Windows and attaches the
# installers to the run (Actions → this run → Artifacts → Static-Cuts-Windows).
name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, desktop-app]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

jobs:
  build:
    runs-on: windows-latest
    env:
      # Set by Nathan in GitHub → Settings → Secrets → Actions. Without it the
      # build still runs; it just isn't published for download.
      HAS_UPLOAD_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm install
      - name: Icons from the site's app icon
        run: npx tauri icon ../public/icon-512.png
      - name: Build
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Static-Cuts-Windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      # Builds from main go up for premium members (static-cuts.com/desktop):
      # the installer into the private "desktop" bucket, then a desktop_releases row.
      - name: Publish for download
        if: github.ref == 'refs/heads/main' && env.HAS_UPLOAD_KEY == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          URL: https://pcuyzaamcsegblrauxsa.supabase.co
        run: |
          set -euo pipefail
          FILE=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          SHA=${GITHUB_SHA::7}
          OBJ="windows/static-cuts-$VERSION-$SHA-setup.exe"
          SIZE=$(stat -c %s "$FILE")
          curl -fsS -X POST "$URL/storage/v1/object/desktop/$OBJ" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/octet-stream" -H "x-upsert: true" \
            --data-binary "@$FILE" > /dev/null
          curl -fsS -X POST "$URL/rest/v1/desktop_releases" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"platform\":\"windows\",\"version\":\"$VERSION\",\"path\":\"$OBJ\",\"size\":$SIZE,\"commit_sha\":\"$SHA\"}" > /dev/null
          echo "Published $OBJ ($SIZE bytes)"
